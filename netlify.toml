[build]
  command = "pnpm install && pnpm nuxi build"
  publish = "dist"
  functions = ".netlify/functions-internal"

[context.production.environment]
  NODE_ENV = "production"

# Deploys from non-production branches use Netlify Branch Deploys.
[context.branch-deploy]
  command = "pnpm install && pnpm nuxi build"
  publish = "dist"

# Keep the develop branch on the Branch Deploy context explicitly.
[context.develop]
  command = "pnpm install && pnpm nuxi build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
